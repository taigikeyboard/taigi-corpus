[project]
name = "taigi-corpus"
version = "0.1.0"
description = "Taiwanese language corpus pipeline for model training"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
    "beautifulsoup4==4.14.3",
    "lxml==6.1.0",
    "pandas==3.0.3",
    "openpyxl==3.1.5",
    "pypdf==6.11.0",
    "odfpy==1.4.1",
]

[project.scripts]
corpus = "corpus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corpus"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
