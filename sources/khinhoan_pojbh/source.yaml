description: "2,733 articles from the NTNU 白話字文獻館 project (2007-2010), spanning 1885-2008 Taiwanese Presbyterian-Church publications (台灣教會公報, 芥菜子, 台南府城教會報, etc.). Each article carries paragraph-aligned Han-Lo (text) and POJ-diacritic (metadata.parallel_poj) versions. Built from the upstream pojbh.json snapshot."
